version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      langchain4j:
        patterns: ["dev.langchain4j*"]
      a2a:
        patterns: ["org.a2aproject*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /web-server
    schedule:
      interval: monthly
