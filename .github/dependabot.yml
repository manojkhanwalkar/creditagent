# Minor and patch bumps not in a named group arrive as one grouped PR per ecosystem
# (claude-skills efficiency.md, rule 4); majors stay separate.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      langchain4j:
        patterns: ["dev.langchain4j*"]
      a2a:
        patterns: ["org.a2aproject*"]
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web-server
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
