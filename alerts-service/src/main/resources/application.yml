server:
  port: ${PORT:8092}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: alerts-service

credit:
  alerts:
    # Required: only the web server, presenting this token, may ask. Empty = the API is off (404).
    service-token: ${INTERNAL_API_TOKEN:}
    table: ${ALERTS_TABLE:Alerts}
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    # Shorter than the web server's ALERTS_TIMEOUT (3 s a try), so a slow DynamoDB answers 503 before
    # the caller gives up and retries: retries never stack on work still running here.
    dynamodb-timeout: ${ALERTS_DYNAMODB_TIMEOUT:2s}
    create-tables: ${DYNAMODB_CREATE_TABLES:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
