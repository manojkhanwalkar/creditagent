server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: credit-report-mcp-server

credit:
  mcp:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  # The CreditReports DynamoDB table, written by the credit report generator.
  reports:
    # Required, and the same as the generator's: keys the SSN hash in the table's ssn column.
    ssn-hash-key: ${CREDIT_FILE_HMAC_KEY}
    # Required, and the same as the generator's: decrypts each report (AES-256-GCM). No default on purpose.
    encryption-key: ${CREDIT_REPORT_ENCRYPTION_KEY}
    # After a rotation: the old keys, comma-separated, so reports written with them can still be read.
    previous-encryption-keys: ${CREDIT_REPORT_PREVIOUS_ENCRYPTION_KEYS:}
    table: ${CREDIT_REPORTS_TABLE:CreditReports}
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    dynamodb-timeout: ${DYNAMODB_TIMEOUT:5s}
    create-tables: ${DYNAMODB_CREATE_TABLES:false}
  nrg:
    url: ${NRG_URL:http://localhost:8084}
    timeout: ${DOWNSTREAM_TIMEOUT:5s}

  # Third-party pulls check that the consumer has not locked their report (fail closed).
  report-lock:
    url: ${REPORT_LOCK_URL:http://localhost:8080}
    token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
