# Local stack. Build the jars first: mvn -B package -DskipTests
# Then: cp .env.example .env  (and set the keys it lists), docker compose up --build
#
# Only the web UI and OAuth server (8080), the client agent (8086), the dummy KYC provider's sample
# cards (8087), the Claude connector (8088) and Mailpit's inbox (8025: every alert email, unauthenticated,
# so local only) are published, and only on localhost.
# Everything else talks over the private compose network.

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  credit-report-generator:
    <<: *service
    build: { context: ., args: { MODULE: credit-report-generator } }
    environment:
      CREDIT_FILE_HMAC_KEY: ${CREDIT_FILE_HMAC_KEY:?Set CREDIT_FILE_HMAC_KEY in .env}
      CREDIT_REPORT_ENCRYPTION_KEY: ${CREDIT_REPORT_ENCRYPTION_KEY:?Set CREDIT_REPORT_ENCRYPTION_KEY in .env}
      CREDIT_REPORT_PREVIOUS_ENCRYPTION_KEYS: ${CREDIT_REPORT_PREVIOUS_ENCRYPTION_KEYS:-}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      CREDIT_SEED_SSNS: ${CREDIT_SEED_SSNS:-}
    depends_on: [dynamodb]

  normalized-report-generator:
    <<: *service
    build: { context: ., args: { MODULE: normalized-report-generator } }

  credit-report-mcp-server:
    <<: *service
    build: { context: ., args: { MODULE: credit-report-mcp-server } }
    environment:
      CREDIT_FILE_HMAC_KEY: ${CREDIT_FILE_HMAC_KEY:?Set CREDIT_FILE_HMAC_KEY in .env}
      CREDIT_REPORT_ENCRYPTION_KEY: ${CREDIT_REPORT_ENCRYPTION_KEY:?Set CREDIT_REPORT_ENCRYPTION_KEY in .env}
      CREDIT_REPORT_PREVIOUS_ENCRYPTION_KEYS: ${CREDIT_REPORT_PREVIOUS_ENCRYPTION_KEYS:-}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      NRG_URL: http://normalized-report-generator:8084
      # The get_credit_report tool checks report locks with the web server (no depends_on: the
      # web server depends on this service, and the check connects lazily).
      REPORT_LOCK_URL: http://web-server:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on: [normalized-report-generator, dynamodb]

  score-calculator:
    <<: *service
    build: { context: ., args: { MODULE: score-calculator } }

  # Dummy KYC provider: checks the SSN card photo uploaded at registration and reads the SSN from it.
  # Published on localhost only so you can download sample cards:
  #   curl -o card.png localhost:8087/api/v1/sample-cards/123-45-6789          (sharp)
  #   curl -o blurry.png 'localhost:8087/api/v1/sample-cards/123-45-6789?blur=4' (refused as blurred)
  kyc-service:
    <<: *service
    build: { context: ., args: { MODULE: kyc-service } }
    environment:
      KYC_SAMPLE_CARDS_ENABLED: "true"
    ports:
      - "127.0.0.1:8087:8087"

  # Users, sessions, alerts and the encrypted credit reports. DynamoDB Local in memory: everything is
  # lost when the stack stops (the generator re-seeds CREDIT_SEED_SSNS at start-up).
  # In AWS, point DYNAMODB_ENDPOINT at nothing and give the web server an IAM role instead.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web-server:
    <<: *service
    build: { context: ., args: { MODULE: web-server } }
    environment:
      CREDIT_MCP_URL: http://credit-report-mcp-server:8082/mcp
      SCORE_CALCULATOR_URL: http://score-calculator:8081
      KYC_URL: http://kyc-service:8087
      ADVISOR_URL: http://user-advisor-agent:8089
      OFFERS_URL: http://offers-service:8090
      ALERTS_URL: http://alerts-service:8092
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SSN_HMAC_KEY: ${SSN_HMAC_KEY:?Set SSN_HMAC_KEY in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      # OAuth for the Claude connector. Empty OAUTH_TOKEN_KEY turns it off.
      OAUTH_TOKEN_KEY: ${OAUTH_TOKEN_KEY:-}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8080}
      CONNECTOR_RESOURCE_URL: ${CONNECTOR_PUBLIC_URL:-http://localhost:8088}/mcp
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      # DynamoDB Local accepts any credentials; real AWS uses the instance or task role.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [credit-report-mcp-server, score-calculator, kyc-service, dynamodb, user-advisor-agent, offers-service, alerts-service]

  credit-intelligence-agent:
    <<: *service
    build: { context: ., args: { MODULE: credit-intelligence-agent } }
    environment:
      CREDIT_MCP_URL: http://credit-report-mcp-server:8082/mcp
      SCORE_CALCULATOR_URL: http://score-calculator:8081
      AGENT_PUBLIC_URL: http://credit-intelligence-agent:8085
      REPORT_LOCK_URL: http://web-server:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [credit-report-mcp-server, score-calculator, web-server]

  client-agent:
    <<: *service
    build: { context: ., args: { MODULE: client-agent } }
    environment:
      INTELLIGENCE_AGENT_URL: http://credit-intelligence-agent:8085
    ports:
      - "127.0.0.1:8086:8086"
    depends_on: [credit-intelligence-agent]

  # Credit card offers for a score and ZIP code: an MCP tool, and a REST API that calls it. The web
  # server asks for them at login. Placeholder catalogue until an offers marketplace exists.
  offers-service:
    <<: *service
    build: { context: ., args: { MODULE: offers-service } }
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}

  # Dark-web alerts. The monitor checks registered users' emails against known locations and writes
  # what it finds to the Alerts table; alerts-service answers the web server's look-up at login.
  # The monitor's source is a placeholder: it contacts nothing on the dark web.
  dark-web-monitor:
    <<: *service
    build: { context: ., args: { MODULE: dark-web-monitor } }
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      DARKWEB_PLACEHOLDER_EXPOSED: ${DARKWEB_PLACEHOLDER_EXPOSED:-}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on: [dynamodb, web-server]

  # Once a day emails each user whose address was found in the last 24 hours. Locally the emails go to
  # Mailpit (http://localhost:8025); in production point MAIL_HOST at a real relay.
  alert-notifier:
    <<: *service
    build: { context: ., args: { MODULE: alert-notifier } }
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Off only for the bundled Mailpit: for any other MAIL_HOST set both to true in .env (the
      # notifier refuses to start with STARTTLS off for a relay that is not local).
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      NOTIFIER_CRON: ${NOTIFIER_CRON:-0 0 8 * * *}
      NOTIFIER_APP_URL: ${NOTIFIER_APP_URL:-http://localhost:8080}
    depends_on: [dynamodb, mailpit]

  # Catches the notifier's emails locally; nothing leaves the machine. Web UI on 127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.20.0
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8025:8025"

  alerts-service:
    <<: *service
    build: { context: ., args: { MODULE: alerts-service } }
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on: [dynamodb]

  # Chatbot back end: answers a signed-in user's questions about their own report, behind input and
  # output guardrails, with conversation memory in RAM only. Called only by the web server.
  user-advisor-agent:
    <<: *service
    build: { context: ., args: { MODULE: user-advisor-agent } }
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      # One JSON line per chat turn for offline evals (redacted; never the report).
      ADVISOR_EVAL_LOG_DIR: /data/evals
    volumes:
      - advisor-evals:/data/evals

  # Remote MCP server for Claude (Settings > Connectors > Add custom connector). Claude reaches it
  # from the internet, so put both this and the web server behind public HTTPS (see the README).
  claude-connector:
    <<: *service
    build: { context: ., args: { MODULE: claude-connector } }
    environment:
      CONNECTOR_PUBLIC_URL: ${CONNECTOR_PUBLIC_URL:-http://localhost:8088}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-http://localhost:8080}
      WEB_SERVER_URL: http://web-server:8080
      CREDIT_MCP_URL: http://credit-report-mcp-server:8082/mcp
      SCORE_CALCULATOR_URL: http://score-calculator:8081
      CLIENT_AGENT_URL: http://client-agent:8086
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    ports:
      - "127.0.0.1:8088:8088"
    depends_on: [web-server, credit-report-mcp-server, score-calculator, client-agent]

volumes:
  advisor-evals:
