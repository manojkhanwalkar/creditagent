# Local stack. Build the jars first: mvn -B package -DskipTests
# Then: cp .env.example .env  (and set CREDIT_FILE_HMAC_KEY), docker compose up --build
#
# Only the web UI (8080), the client agent (8086) and the dummy KYC provider's sample cards (8087)
# are published, and only on localhost.
# Everything else talks over the private compose network.

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  credit-report-generator:
    <<: *service
    build: { context: ., args: { MODULE: credit-report-generator } }
    environment:
      CREDIT_REPORTS_DIR: /data/Reports
      CREDIT_FILE_HMAC_KEY: ${CREDIT_FILE_HMAC_KEY:?Set CREDIT_FILE_HMAC_KEY in .env}
      CREDIT_SEED_SSNS: ${CREDIT_SEED_SSNS:-}
    volumes:
      - credit-reports:/data/Reports

  normalized-report-generator:
    <<: *service
    build: { context: ., args: { MODULE: normalized-report-generator } }

  credit-report-mcp-server:
    <<: *service
    build: { context: ., args: { MODULE: credit-report-mcp-server } }
    environment:
      CREDIT_REPORTS_DIR: /data/Reports
      CREDIT_FILE_HMAC_KEY: ${CREDIT_FILE_HMAC_KEY:?Set CREDIT_FILE_HMAC_KEY in .env}
      NRG_URL: http://normalized-report-generator:8084
    volumes:
      - credit-reports:/data/Reports:ro
    depends_on: [normalized-report-generator]

  score-calculator:
    <<: *service
    build: { context: ., args: { MODULE: score-calculator } }

  # Dummy KYC provider: checks the SSN card photo uploaded at registration and reads the SSN from it.
  # Published on localhost only so you can download sample cards:
  #   curl -o card.png localhost:8087/api/v1/sample-cards/123-45-6789          (sharp)
  #   curl -o blurry.png 'localhost:8087/api/v1/sample-cards/123-45-6789?blur=4' (refused as blurred)
  kyc-service:
    <<: *service
    build: { context: ., args: { MODULE: kyc-service } }
    environment:
      KYC_SAMPLE_CARDS_ENABLED: "true"
    ports:
      - "127.0.0.1:8087:8087"

  # Users and sessions. DynamoDB Local in memory: accounts are lost when the stack stops.
  # In AWS, point DYNAMODB_ENDPOINT at nothing and give the web server an IAM role instead.
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  web-server:
    <<: *service
    build: { context: ., args: { MODULE: web-server } }
    environment:
      CREDIT_MCP_URL: http://credit-report-mcp-server:8082/mcp
      SCORE_CALCULATOR_URL: http://score-calculator:8081
      KYC_URL: http://kyc-service:8087
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      SSN_HMAC_KEY: ${SSN_HMAC_KEY:?Set SSN_HMAC_KEY in .env}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_CREATE_TABLES: "true"
      # DynamoDB Local accepts any credentials; real AWS uses the instance or task role.
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [credit-report-mcp-server, score-calculator, kyc-service, dynamodb]

  credit-intelligence-agent:
    <<: *service
    build: { context: ., args: { MODULE: credit-intelligence-agent } }
    environment:
      CREDIT_MCP_URL: http://credit-report-mcp-server:8082/mcp
      SCORE_CALCULATOR_URL: http://score-calculator:8081
      AGENT_PUBLIC_URL: http://credit-intelligence-agent:8085
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [credit-report-mcp-server, score-calculator]

  client-agent:
    <<: *service
    build: { context: ., args: { MODULE: client-agent } }
    environment:
      INTELLIGENCE_AGENT_URL: http://credit-intelligence-agent:8085
    ports:
      - "127.0.0.1:8086:8086"
    depends_on: [credit-intelligence-agent]

volumes:
  credit-reports:
