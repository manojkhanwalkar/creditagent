server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: web-server
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Registration uploads a photo of the user's Social Security card. Larger uploads get 413.
      max-file-size: ${SSN_CARD_MAX_BYTES:5MB}
      max-request-size: ${SSN_CARD_MAX_REQUEST_BYTES:6MB}

credit:
  web:
    mcp-url: ${CREDIT_MCP_URL:http://localhost:8082/mcp}
    score-calculator-url: ${SCORE_CALCULATOR_URL:http://localhost:8081}
    timeout: ${DOWNSTREAM_TIMEOUT:5s}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
  kyc:
    # KYC provider that checks the SSN card photo and reads the SSN from it (kyc-service locally).
    url: ${KYC_URL:http://localhost:8087}
    timeout: ${KYC_TIMEOUT:10s}
  inbound:
    # Shared limits cover the API only: page loads (HTML, CSS, JS) must not use up the bucket.
    url-patterns: /api/*
  auth:
    # Required. HMAC-SHA256 key for signing JWTs, at least 32 characters. No default on purpose.
    jwt-secret: ${JWT_SECRET}
    # Required. Key for the keyed hash (HMAC-SHA256) of each user's SSN; at least 32 characters.
    # Changing it orphans every registered SSN. No default on purpose.
    ssn-hmac-key: ${SSN_HMAC_KEY}
    jwt-issuer: credit-agent
    # Hard cap on a token's life; the session also ends after session-idle-timeout without use.
    token-ttl: ${JWT_TTL:1h}
    session-idle-timeout: ${SESSION_IDLE_TIMEOUT:5m}
    dynamodb:
      # Empty = the real AWS endpoint for the region. Set to http://localhost:8000 for DynamoDB Local.
      endpoint: ${DYNAMODB_ENDPOINT:}
      region: ${AWS_REGION:us-east-1}
      users-table: ${USERS_TABLE:credit-agent-users}
      sessions-table: ${SESSIONS_TABLE:credit-agent-sessions}
      # Create the tables (and the sessions TTL) at start-up if they are missing. Off for production,
      # where tables belong to infrastructure code.
      create-tables: ${DYNAMODB_CREATE_TABLES:false}
      # Longest a DynamoDB call may take, retries included (each attempt gets half).
      timeout: ${DYNAMODB_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
