server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: web-server
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Registration uploads a photo of the user's Social Security card. Larger uploads get 413.
      max-file-size: ${SSN_CARD_MAX_BYTES:5MB}
      max-request-size: ${SSN_CARD_MAX_REQUEST_BYTES:6MB}

credit:
  web:
    mcp-url: ${CREDIT_MCP_URL:http://localhost:8082/mcp}
    score-calculator-url: ${SCORE_CALCULATOR_URL:http://localhost:8081}
    timeout: ${DOWNSTREAM_TIMEOUT:5s}
    # One MCP read includes the MCP server's retries of NRG, so wait longer than for other calls.
    mcp-timeout: ${MCP_TIMEOUT:20s}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
  chat:
    # The User Advisor Agent behind the chat (it needs the same INTERNAL_API_TOKEN).
    advisor-url: ${ADVISOR_URL:http://localhost:8089}
    timeout: ${ADVISOR_TIMEOUT:15s}
  kyc:
    # KYC provider that checks the SSN card photo and reads the SSN from it (kyc-service locally).
    url: ${KYC_URL:http://localhost:8087}
    timeout: ${KYC_TIMEOUT:10s}
  inbound:
    # Shared limits cover the API only: page loads (HTML, CSS, JS) must not use up the bucket.
    url-patterns: /api/*,/internal/*,/oauth/*,/.well-known/*
  internal:
    # Shared token other services present to call /internal/** (the report-lock check). At least
    # 32 characters. Empty = the internal API is off (404), and third-party report pulls are refused.
    token: ${INTERNAL_API_TOKEN:}
  oauth:
    # OAuth 2.1 server for the Claude connector (claude-connector). At least 32 characters; keys for
    # signing client ids and encrypting codes and tokens are derived from it. Empty = OAuth is off
    # (every /oauth endpoint answers 404).
    token-key: ${OAUTH_TOKEN_KEY:}
    # This server's public URL, exactly as browsers and Claude reach it (it is the token issuer).
    issuer: ${OAUTH_ISSUER:http://localhost:8080}
    # The connector's public MCP URL: the only audience tokens are issued for.
    resource: ${CONNECTOR_RESOURCE_URL:http://localhost:8088/mcp}
    # Claude's connector callbacks are allowed by default; loopback URLs serve Claude Code and Desktop.
    allow-loopback-redirects: ${OAUTH_ALLOW_LOOPBACK_REDIRECTS:true}
    # No refresh tokens: after this the user reconnects. Revoking ends it sooner.
    access-token-ttl: ${OAUTH_ACCESS_TOKEN_TTL:1h}
    code-ttl: 60s
  auth:
    # Required. HMAC-SHA256 key for signing JWTs, at least 32 characters. No default on purpose.
    jwt-secret: ${JWT_SECRET}
    # Required. Key for the keyed hash (HMAC-SHA256) of each user's SSN; at least 32 characters.
    # Changing it orphans every registered SSN. No default on purpose.
    ssn-hmac-key: ${SSN_HMAC_KEY}
    jwt-issuer: credit-agent
    # Hard cap on a token's life; the session also ends after session-idle-timeout without use.
    token-ttl: ${JWT_TTL:1h}
    session-idle-timeout: ${SESSION_IDLE_TIMEOUT:5m}
    dynamodb:
      # Empty = the real AWS endpoint for the region. Set to http://localhost:8000 for DynamoDB Local.
      endpoint: ${DYNAMODB_ENDPOINT:}
      region: ${AWS_REGION:us-east-1}
      users-table: ${USERS_TABLE:credit-agent-users}
      sessions-table: ${SESSIONS_TABLE:credit-agent-sessions}
      # Create the tables (and the sessions TTL) at start-up if they are missing. Off for production,
      # where tables belong to infrastructure code.
      create-tables: ${DYNAMODB_CREATE_TABLES:false}
      # Longest a DynamoDB call may take, retries included (each attempt gets half).
      timeout: ${DYNAMODB_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
