server:
  port: ${PORT:8086}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: client-agent

credit:
  client:
    intelligence-agent-url: ${INTELLIGENCE_AGENT_URL:http://localhost:8085}
    timeout: ${INTELLIGENCE_AGENT_TIMEOUT:90s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
