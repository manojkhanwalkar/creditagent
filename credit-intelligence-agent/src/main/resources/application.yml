server:
  port: ${PORT:8085}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: credit-intelligence-agent

credit:
  agent:
    mcp-url: ${CREDIT_MCP_URL:http://localhost:8082/mcp}
    score-calculator-url: ${SCORE_CALCULATOR_URL:http://localhost:8081}
    timeout: ${DOWNSTREAM_TIMEOUT:5s}
    # URL other agents use to reach this one (goes into the A2A agent card).
    public-url: ${AGENT_PUBLIC_URL:}
    llm:
      enabled: ${LLM_ENABLED:false}
      model: ${LLM_MODEL:claude-sonnet-5-5}
      api-key: ${ANTHROPIC_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
