server:
  port: ${PORT:8093}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: alert-notifier

credit:
  notifier:
    # Once a day, 08:00 UTC (Spring cron: second minute hour day month weekday).
    cron: ${NOTIFIER_CRON:0 0 8 * * *}
    # Each run emails alerts no email has covered yet, found within this long before the run: normally
    # the last 24 hours (the previous run took the rest); the longer lookback lets a missed run catch up.
    lookback: ${NOTIFIER_LOOKBACK:7d}
    max-alerts-per-run: ${NOTIFIER_MAX_ALERTS_PER_RUN:10000}
    sends-per-second: ${NOTIFIER_SENDS_PER_SECOND:10}
    app-url: ${NOTIFIER_APP_URL:}
    dynamodb-endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    dynamodb-timeout: ${DYNAMODB_TIMEOUT:5s}
    alerts-table: ${ALERTS_TABLE:Alerts}
    # Only ID Protection subscribers are emailed; read-only (dynamodb:GetItem).
    subscriptions-table: ${SUBSCRIPTIONS_TABLE:credit-agent-subscriptions}
    create-tables: ${DYNAMODB_CREATE_TABLES:false}
  # The notification-service, which sends the alert email (DARK_WEB_ALERT template, POST
  # /internal/v1/notifications with INTERNAL_API_TOKEN). Without the token no email is sent and alerts
  # stay unclaimed.
  notifications:
    url: ${NOTIFICATIONS_URL:http://localhost:8094}
    # Longest one call may take; above the service's own worst case (about 8 s). Not retried: a failed
    # send releases its claims and the next run tries again.
    timeout: ${NOTIFICATIONS_TIMEOUT:15s}
  internal:
    # The shared service token the notification-service expects.
    token: ${INTERNAL_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
