server:
  port: ${PORT:8084}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: normalized-report-generator
  mvc:
    problemdetails:
      enabled: true

nrg:
  # Three bureau reports (stored at most 300 KB each) plus envelope, with room to spare.
  max-request-bytes: ${NRG_MAX_REQUEST_BYTES:3200000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
